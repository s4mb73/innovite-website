<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Innovite CRM{% endblock %}</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231a1c25'/><rect x='5' y='13' width='14' height='6' rx='3' fill='%238FB7FF'/><circle cx='25' cy='16' r='3' fill='%238FB7FF'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@1,2&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>

<aside class="sidebar">
  <div class="sb-top">
    <a class="sb-logo" href="{{ url_for('overview') }}">
      <svg class="sb-mark" viewBox="0 0 60 12" fill="none" aria-hidden="true">
        <rect x="0" y="0" width="42" height="12" rx="6" fill="currentColor"/>
        <circle cx="54" cy="6" r="6" fill="currentColor"/>
      </svg>
      <span class="sb-word">innovite</span>
    </a>
    <div class="sb-eyebrow">CRM</div>
  </div>

  <nav class="sb-nav" aria-label="Primary">
    <div class="sb-group" data-section="daily">
      <button class="sb-group-head" type="button" aria-expanded="true" aria-controls="sb-group-daily">
        <span class="sb-group-label">Daily</span>
        <svg class="sb-group-caret" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M3 4.5 L6 7.5 L9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="sb-group-body" id="sb-group-daily">
        <a class="sb-item {% if active=='inbox'    %}is-active{% endif %}"  href="{{ url_for('inbox') }}">Inbox</a>
        <a class="sb-item {% if active=='overview' %}is-active{% endif %}"  href="{{ url_for('overview') }}">Overview</a>
      </div>
    </div>

    <div class="sb-group" data-section="pipeline">
      <button class="sb-group-head" type="button" aria-expanded="true" aria-controls="sb-group-pipeline">
        <span class="sb-group-label">Pipeline</span>
        <svg class="sb-group-caret" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M3 4.5 L6 7.5 L9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="sb-group-body" id="sb-group-pipeline">
        <a class="sb-item {% if active=='clients'  %}is-active{% endif %}"  href="{{ url_for('clients') }}">Clients</a>
        <a class="sb-item {% if active=='leads'    %}is-active{% endif %}"  href="{{ url_for('leads') }}">Leads</a>
        <a class="sb-item {% if active=='outreach' %}is-active{% endif %}"  href="{{ url_for('outreach') }}">Outreach</a>
        <a class="sb-item {% if active=='reports'  %}is-active{% endif %}"  href="{{ url_for('reports') }}">Reports</a>
      </div>
    </div>

    <div class="sb-group" data-section="setup">
      <button class="sb-group-head" type="button" aria-expanded="true" aria-controls="sb-group-setup">
        <span class="sb-group-label">Setup</span>
        <svg class="sb-group-caret" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M3 4.5 L6 7.5 L9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="sb-group-body" id="sb-group-setup">
        <a class="sb-item {% if active=='mailboxes' %}is-active{% endif %}" href="{{ url_for('mailboxes') }}">Mailboxes</a>
        <a class="sb-item {% if active=='settings'  %}is-active{% endif %}" href="{{ url_for('settings') }}">Settings</a>
      </div>
    </div>
  </nav>

  <div class="sb-foot">
    <div class="sb-user-name">Sammy</div>
    <div class="sb-user-mail">sammy@innoviteai.com</div>
  </div>
</aside>

<main class="main">
  {% block content %}{% endblock %}
</main>

<script>
  (function () {
    var KEY = 'crm.sidebar.collapsed';
    var collapsed;
    try { collapsed = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); }
    catch (e) { collapsed = new Set(); }

    document.querySelectorAll('.sb-group').forEach(function (group) {
      var section = group.dataset.section;
      var head = group.querySelector('.sb-group-head');
      var body = group.querySelector('.sb-group-body');
      if (!head || !body) return;

      var hasActive = !!body.querySelector('.is-active');
      var shouldCollapse = collapsed.has(section) && !hasActive;
      setState(head, body, !shouldCollapse);

      head.addEventListener('click', function () {
        var expanded = head.getAttribute('aria-expanded') === 'true';
        setState(head, body, !expanded);
        if (expanded) collapsed.add(section); else collapsed.delete(section);
        try { localStorage.setItem(KEY, JSON.stringify(Array.from(collapsed))); }
        catch (e) {}
      });
    });

    function setState(head, body, expanded) {
      head.setAttribute('aria-expanded', String(expanded));
      body.hidden = !expanded;
    }
  })();
</script>

{% if undo_available %}
<div class="undo-banner" role="status" aria-live="polite">
  <span class="undo-banner-text">{{ undo_description }}</span>
  <span class="undo-banner-ttl" id="undoTTL" data-seconds="{{ undo_seconds_left }}">{{ undo_seconds_left }}s</span>
  <form method="post" action="{{ url_for('leads_undo') }}">
    <button class="undo-banner-btn" type="submit">Undo</button>
  </form>
</div>
<script>
  (function () {
    const el = document.getElementById('undoTTL');
    if (!el) return;
    let s = parseInt(el.dataset.seconds, 10) || 0;
    const tick = setInterval(() => {
      s -= 1;
      if (s <= 0) {
        clearInterval(tick);
        const banner = el.closest('.undo-banner');
        if (banner) banner.remove();
        return;
      }
      el.textContent = s + 's';
    }, 1000);
  })();
</script>
{% endif %}

</body>
</html>
