<body class="login-body">

<main class="login-main">
  <div class="login-card">
    <div class="login-brand">
      <svg class="login-mark" viewBox="0 0 60 12" fill="none" aria-hidden="true">
        <rect x="0" y="0" width="42" height="12" rx="6" fill="currentColor"/>
        <circle cx="54" cy="6" r="6" fill="currentColor"/>
      </svg>
      <span class="login-word">innovite</span>
    </div>

    <h1 class="login-title">You're unsubscribed</h1>
    <p class="login-sub">
      <strong>{{ address }}</strong> won't receive any more email from Innovite or our clients.
    </p>
    <p class="login-sub" style="margin-top:14px;">
      If this was a mistake, reply to any previous email and we'll remove the suppression.
    </p>
  </div>
